# Local development stack: PostgreSQL + the AscendID API.
#   cp .env.example .env   (then edit the values)
#   docker compose up --build
# Swagger UI: http://localhost:8080/swagger
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ascendid_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ascendid_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables Swagger and the development signing certificates
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ascendid_api;Username=postgres;Password=${POSTGRES_PASSWORD}
      AdminUser__Email: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      AdminUser__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: AscendID_API
      Jwt__Audience: AscendID_API_Users

volumes:
  pgdata:
